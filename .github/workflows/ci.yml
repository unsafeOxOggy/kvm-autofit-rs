name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup target add x86_64-unknown-linux-musl && rustup component add clippy rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - run: cargo install cargo-audit --version 0.22.2 --locked && cargo audit
      - run: cargo install cargo-deny --version 0.20.2 --locked && cargo deny check
      - run: bash -n install.sh build.sh
