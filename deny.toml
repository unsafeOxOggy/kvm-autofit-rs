# cargo deny check — supply-chain policy for kvm-autofit (root daemon: keep the tree small)
[graph]
targets = ["x86_64-unknown-linux-musl", "x86_64-unknown-linux-gnu"]

[advisories]
# RustSec: vulnerabilities always fail; unmaintained/yanked crates are reported too.
yanked = "deny"
unmaintained = "workspace"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]

[licenses]
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0"]
confidence-threshold = 0.9
